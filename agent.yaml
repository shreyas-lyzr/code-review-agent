spec_version: "0.1.0"
name: code-review-agent
version: "1.0.0"
description: A code analysis and review agent — adversarial PR/repo reviews with a mandatory security pass (debug leftovers, secrets, dependency CVEs). Driven via gitagent / gitclaw.

model:
  preferred: anthropic:claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2

skills:
  - security-review
  - log-review
  - exa-research
  - pdf-export
  - read-document

runtime:
  max_turns: 30
